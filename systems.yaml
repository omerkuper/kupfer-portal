# Kupfer portal - the systems it opens, starts and watches.
#
# The portal never changes these projects. It runs each one from its own folder, with its own
# virtual environment (.venv), exactly the way you would from PyCharm or PowerShell.
#
# Ports: Poirot and the RFQ desk both default to 8000, so here the RFQ desk runs on 8001.
# If another system calls the desk at a fixed address (Poirot's POIROT_QUOTE_URL, or the desk's
# own PORTAL_BASE_URL in its .env), make sure it says 8001 too - or change the port here.

portal:
  port: 8080          # open the portal at http://localhost:8080
  owner: עומר         # the name on the home screen

# Processes the portal can start and stop. "python" is relative to "folder".
servers:
  - id: poirot
    name: Poirot
    folder: 'D:\poirot-project'
    python: '.venv\Scripts\python.exe'
    args: ["-m", "uvicorn", "simulation_ui.serve:app", "--host", "127.0.0.1", "--port", "8000"]
    port: 8000

  - id: rfq
    name: RFQ Desk
    folder: 'D:\freight-engine-api 2\freight-engine-api-clean'
    python: '.venv\Scripts\python.exe'
    args: ["-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8001"]
    port: 8001

  - id: tracker
    name: Tracker
    folder: 'D:\cargo-tracker'
    python: '.venv\Scripts\python.exe'
    # read-only dashboard; add "--actions" to allow "check now" / "mark as seen" from it
    args: ["dashboard.py", "--no-browser", "--port", "8765"]
    port: 8765

  - id: tracker_api
    name: Tracker API
    folder: 'D:\cargo-tracker'
    python: '.venv\Scripts\python.exe'
    args: ["api.py", "--port", "8770"]   # Poirot asks it for live status (POIROT_TRACKER_URL)
    port: 8770

# The side rail: what each button opens. A view either lives on one of the servers above
# (server + path - it opens as a tab inside the portal) or is an outside address (url - a new window).
views:
  - id: poirot
    label: Poirot
    icon: poirot
    server: poirot
    path: /
  - id: rfq
    label: RFQ
    icon: rfq
    server: rfq
    path: /desk
  - id: sim
    label: סימולציה
    label_en: Simulation
    icon: sim
    server: rfq
    path: /desk/simulation
  - id: tariffs
    label: תעריפים
    label_en: Tariffs
    icon: tariffs
    server: rfq
    path: /desk/tariffs
  - id: tracking
    label: מעקב
    label_en: Tracking
    icon: tracking
    server: tracker
    path: /
  - id: agents
    label: סוכנים
    label_en: Agents
    icon: agents
    server: rfq
    path: /desk/agents
  - id: calculator
    label: מחשבון
    label_en: Calculator
    icon: calculator
    url: ""            # your Render address, e.g. https://<your-app>.onrender.com/calculator

# "Quick start" on the home screen: a view, and the page inside it to open.
quick:
  - label: תיק חדש
    label_en: New file
    view: poirot
    path: /shipments/new
    tag: POIROT
    icon: poirot
  - label: בקשת מחיר מסוכנים
    label_en: Ask agents for a price
    view: rfq
    path: /desk
    tag: RFQ
    icon: rfq
  - label: סימולציה חדשה
    label_en: New simulation
    view: sim
    path: /desk/simulation
    tag: SIM
    icon: sim
  - label: העלאת מחירון
    label_en: Upload a rate sheet
    view: tariffs
    path: /desk/tariffs
    tag: TARIFFS
    icon: upload
  - label: הוספת סוכן
    label_en: Add an agent
    view: agents
    path: /desk/agents
    tag: AGENTS
    icon: agents
  - label: בדיקת שטר מטען
    label_en: Check a B/L
    view: tracking
    path: /
    tag: TRACKER
    icon: tracking

# The four steps of the work, on the home screen. Phase 1: each opens its system; the counts arrive in phase 2.
flow:
  - label: בקשות מחיר
    label_en: Price requests
    view: rfq
    tag: RFQ
  - label: הצעות ללקוח
    label_en: Client offers
    view: sim
    path: /desk/saved
    tag: SIM
  - label: בתפעול
    label_en: In operation
    view: poirot
    tag: POIROT
  - label: מטענים בדרך
    label_en: Cargo on the way
    view: tracking
    tag: TRACKER
