{% macro icon(name, size=21) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' %}<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>
{%- elif name == 'logout' %}<path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4"/><path d="M9 12h9"/>
{%- elif name == 'lock' %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'poirot' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/>
{%- elif name == 'rfq' %}<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>
{%- elif name == 'sim' %}<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
{%- elif name == 'tariffs' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>
{%- elif name == 'tracking' %}<path d="M3 15l2 5h14l2-5z"/><path d="M6 15V9h12v6"/><path d="M10 9V5h4v4"/>
{%- elif name == 'agents' %}<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M19 8v6M16 11h6"/>
{%- elif name == 'calculator' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8"/><path d="M8.5 12h1M11.5 12h1M14.5 12h1M8.5 16h1M11.5 16h1M14.5 16h1"/>
{%- elif name == 'upload' %}<path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v5h16v-5"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == 'play' %}<path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/>
{%- elif name == 'stop' %}<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>
{%- elif name == 'restart' %}<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>
{%- elif name == 'log' %}<path d="M4 6l5 6-5 6"/><path d="M12 18h8"/>
{%- elif name == 'external' %}<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>
{%- elif name == 'close' %}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == 'chevron' %}<path d="M15 6l-6 6 6 6"/>
{%- elif name == 'bell' %}<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro bird(size=36) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 15 L9.5 17.5 L4.5 21.5 Z" fill="#C8662C"/><path d="M9 18 C11 12.5 17.5 11 21.5 13.5 C24 15.5 22.5 20 18.5 21.3 C14.8 22.5 11.2 21.3 9 18 Z" fill="#F0904A"/><path d="M14.5 15.5 C12.5 9 15 3.5 21 2 C18.5 6.5 18.8 10.5 18.2 15 Z" fill="#F7B98A"/><circle cx="22.6" cy="12.2" r="2.6" fill="#F0904A"/><path d="M24.8 11.2 L31 8.6" stroke="#F0904A" stroke-width="1.4" stroke-linecap="round"/></svg>
{%- endmacro %}

{% macro spectrum() -%}
<div class="spectrum" aria-hidden="true" dir="ltr"><span style="left:21.7%;background:#4C7DFF"></span><span style="left:36.9%;background:#2FD39A"></span><span style="left:38.4%;background:#46DB6A;width:3px"></span><span style="left:40.6%;background:#7DE04A"></span><span style="left:56.7%;background:#D7E22E"></span><span style="left:59.4%;background:#F2C22B;width:3px"></span></div>
{%- endmacro %}
